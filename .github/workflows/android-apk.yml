name: Build Android APK

on:
  push:
    tags: ["android/v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync

      - name: Set up JDK
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build debug APK
        run: |
          unset ANDROID_SDK_ROOT
          ./gradlew assembleDebug
        working-directory: ./android

      - name: Prepare artifact
        run: |
          mkdir -p ./out
          cp ./android/app/build/outputs/apk/debug/app-debug.apk ./out/gitgost-android-debug.apk
          cd ./out
          sha256sum gitgost-android-debug.apk > gitgost-android-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitgost-android-debug
          path: ./out/*
          retention-days: 30

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/android/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: ./out/*
