name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["android/v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: ./android

      - name: Prepare artifact
        run: |
          mkdir -p ./out
          cp ./android/app/build/outputs/apk/debug/app-debug.apk ./out/gitgost-android-debug.apk
          cd ./out
          sha256sum gitgost-android-debug.apk > gitgost-android-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitgost-android-debug
          path: ./out/*
          retention-days: 30

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/android/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./out/*
