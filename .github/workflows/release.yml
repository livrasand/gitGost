name: Build & Attest

on:
  push:
    branches: [main]
    tags: ["v*", "gren/*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-attest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod

      - name: Get commit info
        id: info
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build (reproducible)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w \
              -X 'github.com/livrasand/gitGost/internal/http.commitHash=${{ steps.info.outputs.sha }}' \
              -X 'github.com/livrasand/gitGost/internal/http.buildTime=${{ steps.info.outputs.built }}' \
              -X 'github.com/livrasand/gitGost/internal/http.sourceRepo=https://github.com/${{ github.repository }}'" \
            -o gitgost \
            ./cmd/server

      - name: SHA-256 del binario
        id: sha
        run: |
          HASH=$(sha256sum gitgost | awk '{print $1}')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "### Binary SHA-256" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "gitgost  $HASH" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ steps.info.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance (Sigstore)
        id: attest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: gitgost

      - name: Publicar SHA-256 como artefacto
        run: |
          echo "${{ steps.sha.outputs.hash }}  gitgost" > gitgost.sha256
          echo "commit: ${{ steps.info.outputs.sha }}" >> gitgost.sha256
          echo "built:  ${{ steps.info.outputs.built }}" >> gitgost.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: gitgost-${{ steps.info.outputs.short }}
          path: |
            gitgost
            gitgost.sha256
          retention-days: 90

      - name: Create/update release on tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          files: |
            gitgost
            gitgost.sha256
          body: |
            ## Verificación criptográfica

            **Commit:** `${{ steps.info.outputs.sha }}`
            **SHA-256:** `${{ steps.sha.outputs.hash }}`

            ### Verificar con GitHub CLI (recomendado)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/gitgost -o gitgost
            gh attestation verify gitgost --repo ${{ github.repository }}
            ```

            ### Verificar manualmente
            ```bash
            sha256sum gitgost
            # Debe coincidir con: ${{ steps.sha.outputs.hash }}
            ```

            ### Verificar el binario desplegado
            ```bash
            curl -o gitgost-server https://gitgost.fly.dev/gitgost-bin
            sha256sum gitgost-server
            # Debe coincidir con el hash de arriba
            ```

            El attestation queda registrado en el transparency log de Sigstore (Rekor), auditable por cualquier tercero independiente del operador.

            ## Cliente git-gost

            Descarga el binario de tu plataforma (git-gost-darwin-arm64, git-gost-darwin-amd64, git-gost-linux-amd64, git-gost-linux-arm64 o git-gost-windows-amd64.exe) y su archivo .sha256, verifica el hash y auto-instálalo:

            ```bash
            ./git-gost-darwin-arm64 install
            ```

            El comando copia el binario como `git-gost` en `~/.local/bin` y añade ese directorio al PATH de tu shell (en Windows indica el directorio a añadir manualmente).

  build-client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod

      - name: Get commit info
        id: info
        run: |
          short=$(git rev-parse --short HEAD)
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "ver=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=$short" >> "$GITHUB_OUTPUT"
          fi

      - name: Build git-gost (${{ matrix.os }}/${{ matrix.arch }})
        id: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          BIN="git-gost-${{ matrix.os }}-${{ matrix.arch }}$EXT"
          go build \
            -trimpath \
            -ldflags="-s -w \
              -X 'github.com/livrasand/gitGost/internal/cli.version=${{ steps.info.outputs.ver }}'" \
            -o "$BIN" \
            ./cmd/gost
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"

      - name: SHA-256 del binario
        id: sha
        run: |
          BIN="${{ steps.build.outputs.bin }}"
          HASH=$(sha256sum "$BIN" | awk '{print $1}')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "### git-gost SHA-256 (${{ matrix.os }}/${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$BIN  $HASH" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance (Sigstore)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: ${{ steps.build.outputs.bin }}

      - name: Publicar SHA-256 como artefacto
        run: |
          BIN="${{ steps.build.outputs.bin }}"
          echo "${{ steps.sha.outputs.hash }}  $BIN" > "$BIN.sha256"
          echo "commit: ${{ steps.info.outputs.short }}" >> "$BIN.sha256"
          echo "built:  ${{ steps.info.outputs.built }}" >> "$BIN.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: git-gost-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ steps.build.outputs.bin }}
            ${{ steps.build.outputs.bin }}.sha256
          retention-days: 90

      - name: Create/update release on tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          files: |
            ${{ steps.build.outputs.bin }}
            ${{ steps.build.outputs.bin }}.sha256
