# fly.toml app configuration file generated for gitgost-qa on 2026-08-17T18:37:03Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gitgost-qa'
primary_region = 'ams'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
