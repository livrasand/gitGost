# fly.toml app configuration file generated for gitgost on 2026-05-14T23:27:43Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gitgost'
primary_region = 'arn'

[build]
  [build.args]
    GO_VERSION = '1.22'

[env]
  PORT = '8080'
  # Maintenance mode: serves a 503 page for browsers/APIs while keeping git
  # access, /health, /api/status and /admin available. Prefer runtime toggle
  # (POST /admin/panic {"maintenance":true}) or: fly secrets set MAINTENANCE_MODE=true
  MAINTENANCE_MODE = 'false'
  # The CAPTCHA session cookie ("gost_gate") is signed with GITGOST_GATE_KEY.
  # The machine filesystem is ephemeral, so without a secret the key changes on
  # every deploy and every visitor session expires. Set it with:
  # fly secrets set GITGOST_GATE_KEY=$(openssl rand -hex 32)

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # /health stays reachable in maintenance mode, so the machine is kept
  # healthy (and restarted if it dies) even while the site is suspended.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
