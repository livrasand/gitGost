<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Just a moment...</title>
    <link rel="icon" type="image/svg+xml" href="/assets/logos/gitgost-logo.svg">
    <style>
        * { box-sizing: border-box; }

        :root {
            /* Paleta zen de openbin (tema claro) */
            --zen-paper: #f2f0e3;
            --zen-dark: #2e2e2e;
            --bg: var(--zen-paper);
            --fg: var(--zen-dark);
            --fg-muted: color-mix(in srgb, var(--zen-dark) 60%, transparent);
            --fg-secondary: color-mix(in srgb, var(--zen-dark) 40%, transparent);
            --bg-secondary: color-mix(in srgb, var(--zen-dark) 6%, var(--zen-paper));
            --bg-hover: color-mix(in srgb, var(--zen-dark) 12%, var(--zen-paper));
            --accent: #f76f53;
            --border: color-mix(in srgb, var(--zen-dark) 12%, var(--zen-paper));
            --card: color-mix(in srgb, var(--zen-dark) 6%, var(--zen-paper));
            --code-bg: color-mix(in srgb, var(--zen-dark) 6%, var(--zen-paper));
            --radius-lg: 0px;
            --radius-md: 0px;
            --radius-sm: 0px;
            --radius-pill: 0px;
        }

        :root[data-theme="dark"] {
            /* Paleta zen de openbin (tema oscuro) */
            --zen-paper: #1f1f1f;
            --zen-dark: #d1cfc0;
            --bg: var(--zen-paper);
            --fg: var(--zen-dark);
            --fg-muted: color-mix(in srgb, var(--zen-dark) 60%, transparent);
            --fg-secondary: color-mix(in srgb, var(--zen-dark) 40%, transparent);
            --bg-secondary: color-mix(in srgb, var(--zen-dark) 8%, var(--zen-paper));
            --bg-hover: color-mix(in srgb, var(--zen-dark) 14%, var(--zen-paper));
            --accent: #f76f53;
            --border: color-mix(in srgb, var(--zen-dark) 14%, var(--zen-paper));
            --card: color-mix(in srgb, var(--zen-dark) 8%, var(--zen-paper));
            --code-bg: color-mix(in srgb, var(--zen-dark) 8%, var(--zen-paper));
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme]) {
                --zen-paper: #1f1f1f;
                --zen-dark: #d1cfc0;
                --bg: var(--zen-paper);
                --fg: var(--zen-dark);
                --fg-muted: color-mix(in srgb, var(--zen-dark) 60%, transparent);
                --fg-secondary: color-mix(in srgb, var(--zen-dark) 40%, transparent);
                --bg-secondary: color-mix(in srgb, var(--zen-dark) 8%, var(--zen-paper));
                --bg-hover: color-mix(in srgb, var(--zen-dark) 14%, var(--zen-paper));
                --accent: #f76f53;
                --border: color-mix(in srgb, var(--zen-dark) 14%, var(--zen-paper));
                --card: color-mix(in srgb, var(--zen-dark) 8%, var(--zen-paper));
                --code-bg: color-mix(in srgb, var(--zen-dark) 8%, var(--zen-paper));
            }
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif;
            background: var(--bg);
            color: var(--fg);
            font-size: 13px;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        .app-container {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.25rem 3rem;
            margin: 0 auto;
            width: 100%;
            min-height: 0;
        }

        .main-content {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        .challenge-logo {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -0.5px;
            text-decoration: none;
            margin-bottom: 1.25rem;
        }

        .challenge-logo:hover { text-decoration: underline; }

        .challenge-box {
            max-width: 420px;
            width: 100%;
            border: 1px solid var(--border);
            background: var(--card);
            border-radius: 0;
            padding: 2rem 1.75rem;
            text-align: center;
        }

        #challenge-spinner {
            width: 32px;
            height: 32px;
            margin: 0 auto 1.25rem;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: challenge-spin 0.8s linear infinite;
        }
        @keyframes challenge-spin { to { transform: rotate(360deg); } }

        #challenge-heading {
            margin: 0 0 0.75rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1.3;
        }

        #challenge-status {
            margin: 0 0 0.75rem;
            font-size: 0.82rem;
            color: var(--fg-muted);
            line-height: 1.55;
        }

        #challenge-status.challenge-error { color: #a61b1b; }
        #challenge-status.challenge-ok { color: #1a7f37; }
        :root[data-theme="dark"] #challenge-status.challenge-error { color: #ff7b72; }
        :root[data-theme="dark"] #challenge-status.challenge-ok { color: #3fb950; }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme]) #challenge-status.challenge-error { color: #ff7b72; }
            :root:not([data-theme]) #challenge-status.challenge-ok { color: #3fb950; }
        }

        #challenge-meta {
            margin: 0 auto 1.25rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.7rem;
            color: var(--fg-muted);
            min-height: 1.3em;
            max-width: 320px;
            line-height: 1.5;
        }

        #challenge-retry {
            display: none;
            margin: 0 auto;
            border: 1px solid var(--accent);
            background: transparent;
            color: var(--accent);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.78rem;
            padding: 0.4rem 1.1rem;
            border-radius: 0;
            cursor: pointer;
        }

        #challenge-retry:hover,
        #challenge-retry:focus-visible {
            color: var(--bg);
            background: var(--accent);
            outline: none;
        }

        #challenge-foot {
            margin: 1.5rem 0 0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.68rem;
            color: var(--fg-secondary);
            line-height: 1.5;
        }
        #challenge-foot a { color: var(--accent); text-decoration: none; }
        #challenge-foot a:hover { text-decoration: underline; }


        .statusbar {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 0.35rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.72rem;
            color: var(--fg-secondary);
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 50;
        }

        .statusbar-left {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .statusbar-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .statusbar a {
            color: var(--accent);
            text-decoration: none;
        }

        .statusbar a:hover {
            text-decoration: underline;
        }

        .statusbar-command {
            position: relative;
        }

        .statusbar-command-trigger {
            border: 0;
            padding: 0;
            color: var(--fg-secondary);
            background: transparent;
            font: inherit;
            cursor: pointer;
        }

        .statusbar-command-trigger:hover,
        .statusbar-command-trigger:focus-visible {
            color: var(--fg);
            outline: none;
        }

        .statusbar-command-menu {
            position: absolute;
            bottom: calc(100% + 0.25rem);
            left: 0;
            width: 14rem;
            padding: 0.25rem 0;
            border: 1px solid var(--border);
            background: var(--bg);
            box-shadow: none;
        }

        .statusbar-command-menu[hidden] {
            display: none;
        }

        .statusbar-command-menu a,
        .statusbar-command-menu button {
            display: flex;
            align-items: center;
            width: 100%;
            border: 0;
            padding: 0.4rem 0.75rem;
            color: var(--fg);
            background: transparent;
            font: inherit;
            font-size: 0.72rem;
            text-align: left;
            text-decoration: none;
            cursor: pointer;
        }

        .statusbar-command-menu a:hover,
        .statusbar-command-menu button:hover,
        .statusbar-command-menu a:focus-visible,
        .statusbar-command-menu button:focus-visible {
            background: var(--bg-hover);
            outline: none;
        }

        .statusbar-command-menu-divider {
            height: 1px;
            margin: 0.25rem 0;
            background: var(--border);
        }

        @media (max-width: 900px) {
            .app-container {
                padding: 1.25rem 1rem 3rem;
            }
        }

        @media (max-width: 640px) {
            html, body {
                overflow: auto;
                height: auto;
                min-height: 100vh;
                font-size: 15px;
            }

            .app-container {
                flex-direction: column;
                padding: 1rem 0.75rem 3.5rem;
                gap: 0.25rem;
                overflow: visible;
                min-height: 0;
            }

            .main-content {
                width: 100%;
                min-height: 0;
                padding-bottom: 0;
            }

            .challenge-box {
                padding: 1.5rem 1.1rem;
            }

            .statusbar {
                padding: 0.35rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">

        <main class="main-content">
            <div class="challenge-box">
                <div id="challenge-spinner" aria-hidden="true"></div>
                <h1 id="challenge-heading">Verifying you are human</h1>
                <p id="challenge-status" aria-live="polite">This is a proof-of-work check: no cookies, no tracking, no puzzles to solve.</p>
                <p id="challenge-meta"></p>
                <button id="challenge-retry" type="button">Try again</button>
                <p id="challenge-foot">Performance test by <a href="https://github.com/livrasand/mentacaptcha" target="_blank" rel="noopener">Menta</a></p>
            </div>
        </main>
    </div>

        </main>
    </div>

    <footer class="statusbar">
        <div class="statusbar-left statusbar-command">
            <button type="button" id="command-trigger" class="statusbar-command-trigger" aria-haspopup="true" aria-expanded="false">
                <span id="statusbar-path"><a href="/"><span>gitGost</span></a></span>
                <span style="color:var(--accent);">_</span>
            </button>
            <div id="command-menu" class="statusbar-command-menu" hidden>
                <a href="/">home</a>
                <a href="/privacy">privacy</a>
                <div class="statusbar-command-menu-divider"></div>
                <button type="button" onclick="toggleTheme()">toggle theme</button>
            </div>
        </div>
        <div class="statusbar-right">
            <a href="/">home</a>
        </div>
    </footer>
    <script>
        (function () {
            "use strict";
            var hasCookie = document.cookie.split(";").some(function (part) {
                return part.trim().indexOf("gost_gate=") === 0;
            });
            if (hasCookie) return;
            var params = new URLSearchParams(window.location.search);
            var next = params.get("next") || "/";
            var mentaApi = "https://mentacaptchaeu.eu.pythonanywhere.com";
            var mentaNext = "/api/captcha-gate/menta-callback?next=" + encodeURIComponent(next);
            var script = document.createElement("script");
            script.src = mentaApi + "/menta-challenge.js";
            script.setAttribute("data-menta-api", mentaApi);
            script.setAttribute("data-menta-next", mentaNext);
            script.setAttribute("data-menta-i18n-checking", "Verificando que eres humano…");
            script.setAttribute("data-menta-i18n-blocked-title", "Acceso denegado");
            script.setAttribute("data-menta-i18n-blocked-detail", "No se pudo completar la verificación de Menta. Inténtalo de nuevo.");
            script.onerror = function () {
                console.error("Menta challenge script failed to load");
            };
            (document.head || document.documentElement).appendChild(script);
        })();
    </script>
</body>
</html>
