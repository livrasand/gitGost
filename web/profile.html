            const instagramLabel = escHtml((p.instagram || '').replace(/^https?:\/\/(www\.)?instagram\.com\//i, ''));
            const isOrg = p.type === 'org';
            const typeLabel = isOrg ? 'organization' : 'user';
            const joined = formatJoined(p.joined_at);

            // En las vistas SPA (stars/followers/following) el título lo gestiona switchView; no pisarlo.
            if (_currentView === 'overview') document.title = `${p.name || p.username} · gitGost`;

            const header = document.getElementById('profile-header');
            if (header) {
                header.innerHTML = `
                    <div class="avatar">${safeAvatar ? `<img src="${safeAvatar}" alt=""/>` : escHtml((safeName || safeUser).slice(0, 1).toUpperCase())}</div>
                    <div class="id">
                        <div class="fullname">${safeName || safeUser}</div>
                        <div class="username">@${safeUser}</div>
                        <div class="badges">
                            <span class="provider-badge" style="color:${meta.color};border-color:${meta.color};">${meta.icon}${meta.label}</span>
                            <span class="type-badge">${typeLabel}</span>
                        </div>
                    </div>
                `;
            }

            const titleEl = document.getElementById('profile-section-title');
            if (titleEl) titleEl.textContent = `${safeUser} / ${isOrg ? 'organization' : 'profile'}`;

            const sbAbout = document.getElementById('sb-about');
            if (sbAbout) {
                const stats = [];
                if (p.followers !== undefined && p.followers !== null) stats.push(`<div class="stat stat-link" onclick="openPeople('followers'); return false;"><span class="v">${formatNumber(p.followers)}</span><span class="l">followers</span></div>`);
                if (p.following !== undefined && p.following !== null) stats.push(`<div class="stat stat-link" onclick="openPeople('following'); return false;"><span class="v">${formatNumber(p.following)}</span><span class="l">following</span></div>`);
                if (p.public_repos !== undefined && p.public_repos !== null) stats.push(`<div class="stat"><span class="v">${formatNumber(p.public_repos)}</span><span class="l">public repos</span></div>`);
                if (p.packages !== undefined && p.packages !== null && p.packages > 0) stats.push(`<div class="stat"><span class="v">${formatNumber(p.packages)}</span><span class="l">packages</span></div>`);
                sbAbout.innerHTML = `
                    <div class="sb-head">
                        <div class="sb-avatar">${safeAvatar ? `<img src="${safeAvatar}" alt=""/>` : escHtml((safeName || safeUser).slice(0, 1).toUpperCase())}</div>
                        <div>
                            <div class="sb-name">${safeName || safeUser}</div>
                            <div class="sb-user">@${safeUser}</div>

                            <div class="badges">
                                <a href="${safeUrl}" target="_blank" rel="noopener noreferrer"><span class="provider-badge" style="color:${meta.color};border-color:${meta.color};margin-top: 5px;">${meta.icon}${meta.label}</span></a>
                                <span class="type-badge">${typeLabel}</span>
                            </div>
                        </div>
                    </div>
                    ${safeBio ? `<p class="sb-bio">${safeBio}</p>` : ''}
                    ${stats.length ? `<div class="stats-grid">${stats.join('')}</div>` : ''}
                    <ul class="meta-list">
                        ${safeLocation ? `<li><span class="k">location</span><span class="v">${safeLocation}</span></li>` : ''}
                        ${safeWebsite ? `<li><span class="k">website</span><span class="v"><a href="${safeWebsite}" target="_blank" rel="noopener noreferrer">${escHtml(p.website || '')}</a></span></li>` : ''}
                        ${p.twitter ? `<li><span class="k">${X_ICON_SVG}</span><span class="v"><a href="https://x.com/${encodeURIComponent(p.twitter)}" target="_blank" rel="noopener noreferrer">@${escHtml(p.twitter)}</a></span></li>` : ''}
                        ${safeLinkedin ? `<li><span class="k">${LINKEDIN_ICON_SVG}</span><span class="v"><a href="${safeLinkedin}" target="_blank" rel="noopener noreferrer">${linkedinLabel || 'linkedin'}</a></span></li>` : ''}
                        ${safeYoutube ? `<li><span class="k">${YOUTUBE_ICON_SVG}</span><span class="v"><a href="${safeYoutube}" target="_blank" rel="noopener noreferrer">${youtubeLabel || 'youtube'}</a></span></li>` : ''}
                        ${safeInstagram ? `<li><span class="k">${INSTAGRAM_ICON_SVG}</span><span class="v"><a href="${safeInstagram}" target="_blank" rel="noopener noreferrer">${instagramLabel || 'instagram'}</a></span></li>` : ''}
                        ${p.email ? `<li><span class="k">${MAIL_ICON_SVG}</span><span class="v"><a href="mailto:${escAttr(p.email)}">${escHtml(p.email)}</a></span></li>` : ''}
                        ${joined ? `<li><span class="k">joined</span><span class="v">${joined}</span></li>` : ''}
                    </ul>
                `;
            }

            const navCount = document.getElementById('nav-repo-count');
            if (navCount && p.public_repos !== undefined && p.public_repos !== null) {
                navCount.textContent = formatNumber(p.public_repos);
            }

            const navPackagesCount = document.getElementById('nav-packages-count');
            if (navPackagesCount && p.packages !== undefined && p.packages !== null) {
                navPackagesCount.textContent = formatNumber(p.packages);
            }

            // Miembros: solo Codeberg los expone (public_members) y solo para organizaciones.
            const navMembers = document.getElementById('nav-members');
            if (navMembers) {
                const members = (p.members && Array.isArray(p.members)) ? p.members : [];
                if (PROVIDER === 'cb' && p.type === 'org' && members.length > 0) {
                    navMembers.style.display = '';
                    const navMembersCount = document.getElementById('nav-members-count');
                    if (navMembersCount) navMembersCount.textContent = formatNumber(members.length);
                } else {
                    navMembers.style.display = 'none';
                }
            }
        }

        function repoCardHtml(r) {
            const parts = (r.full_name || '').split('/');
            const owner = parts[0] || USERNAME;
            const name = r.name || parts[1] || '';
            const safeOwner = escHtml(owner);
            const safeName = escHtml(name);
            const desc = r.description ? escHtml(r.description.slice(0, 120)) : '';
            const lang = r.language ? escHtml(r.language) : '';
            const ago = timeAgo(r.updated_at);
            const visibility = r.fork ? 'fork' : 'public';
            return `
                <div class="repo-card">
                    <div class="repo-card-head">
                        <a class="repo-name" href="/${encodeURIComponent(PROVIDER)}/${encodeURIComponent(owner)}/${encodeURIComponent(name)}">${safeOwner} / ${safeName}</a>
                        <span class="repo-visibility">${visibility}</span>
                    </div>
                    ${desc ? `<p class="repo-desc">${desc}</p>` : ''}
                    <div class="repo-meta">
                        ${lang ? `<span class="lang"><span class="lang-dot" style="background:${langColor(r.language)};"></span>${lang}</span>` : ''}
                        ${(r.stars || 0) > 0 ? `<span>${STAR_ICON_HTML} ${formatNumber(r.stars)}</span>` : ''}
                        ${(r.forks || 0) > 0 ? `<span>⑂ ${formatNumber(r.forks)}</span>` : ''}
                        ${ago ? `<span>updated ${ago}</span>` : ''}
                    </div>
                </div>
            `;
        }

        function renderRepos(repos) {
            const container = document.getElementById('repos-section');
            if (!container) return;
            const navCount = document.getElementById('nav-repo-count');
            if (navCount && !navCount.textContent) navCount.textContent = String(repos.length);

            if (!repos.length) {
                container.innerHTML = '<div class="repo-empty">no public repositories found</div>';
                return;
            }
            const reposHtml = repos.map(repoCardHtml).join('');
            container.innerHTML = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(reposHtml) : reposHtml;
        }

        // ---- Repos con star del usuario (GitHub / Codeberg; GitLab no lo expone) ----
        function normalizeStarred(r) {
            if (!r || !r.full_name) return null;
            return {
                name: r.name || '',
                full_name: r.full_name,
                description: r.description || '',
                language: r.language || '',
                stars: r.stars_count !== undefined ? r.stars_count : (r.stargazers_count || 0),
                forks: r.forks_count !== undefined ? r.forks_count : (r.forks || 0),
                updated_at: r.updated_at || '',
                fork: !!r.fork,
            };
        }

        async function fetchStarred() {
            const repos = [];
            try {
                if (PROVIDER === 'gh' || PROVIDER === 'cb') {
                    // Vía proxy del servidor: GitHub sin token devuelve 403 (rate-limit por IP)
                    // y Codeberg exige auth para /users/{user}/starred (401 sin token); el
                    // backend reintenta sin token y responde lista vacía si no puede.
                    const items = await apiGet(`/api/users/starred?provider=${PROVIDER}&user=${encodeURIComponent(USERNAME)}`);
                    if (Array.isArray(items)) repos.push(...items.map(normalizeStarred).filter(Boolean));
                }
            } catch (_) {}
            return repos;
        }

        // En la vista de perfil solo se muestra el conteo en el nav; la lista vive en la sección SPA de stars.
        let _starredCache = null;
        async function loadStarred() {
            const starred = _starredCache || (_starredCache = await fetchStarred());
            const navStars = document.getElementById('nav-star-count');
            if (navStars && starred.length > 0) navStars.textContent = formatNumber(starred.length);
        }

        // ---- Vista SPA de repos con star (alterna secciones sin recargar, igual que repo.html) ----
        let _currentView = 'overview';
        let _prevTitle = '';

        function navOverview() {
            if (_currentView !== 'overview') switchView('overview');
            scrollToTop();
        }
        function navRepos() {
            if (_currentView !== 'overview') switchView('overview');
            scrollToRepos();
        }
        function openStars() {
            if (_currentView === 'stars') return;
            switchView('stars');
        }
        function openPeople(kind) {
            if (kind !== 'followers' && kind !== 'following' && kind !== 'members') return;
            if (_currentView === kind) return;
            switchView(kind);
        }
        function openProjects() {
            if (_currentView === 'projects') return;
            switchView('projects');
        }
        function openPackages() {
            if (_currentView === 'packages') return;
            switchView('packages');
        }

        function switchView(view, push) {
            if (push === undefined) push = true;
            if (_currentView === view) return;
            const prev = _currentView;
            const isOverview = view === 'overview';
            const isStars = view === 'stars';
            const isPeople = view === 'followers' || view === 'following' || view === 'members';
            const isProjects = view === 'projects';
            const isPackages = view === 'packages';
            _currentView = view;

            if (push) {
                history.pushState({ view: view }, '', profileViewUrl(view));
            }

            if (!isOverview && prev === 'overview') _prevTitle = document.title;
            if (isOverview) {
                document.title = _prevTitle || `${USERNAME} · gitGost`;
            } else {
                const label = view === 'followers' ? 'followers' : view === 'following' ? 'following' : view === 'members' ? 'members' : view === 'projects' ? 'projects' : view === 'packages' ? 'packages' : 'starred';
                document.title = `${USERNAME} · ${label} · gitGost`;
            }

            const show = (el, on) => { if (el) el.classList.toggle('view-hidden', !on); };
            show(document.getElementById('readme-section'), isOverview);
            show(document.getElementById('orgs-row'), isOverview);
            show(document.getElementById('repos-section-title'), isOverview);
            show(document.getElementById('repos-section'), isOverview);
            show(document.getElementById('starred-section-title'), isStars);
            show(document.getElementById('starred-section'), isStars);
            show(document.getElementById('people-section-title'), isPeople);
            show(document.getElementById('people-section'), isPeople);
            show(document.getElementById('projects-section-title'), isProjects);
            show(document.getElementById('projects-section'), isProjects);
            show(document.getElementById('packages-section-title'), isPackages);
            show(document.getElementById('packages-section'), isPackages);
            const aside = document.querySelector('.right-sidebar');
            if (aside) aside.style.display = isOverview ? '' : 'none';

            const navLinks = document.querySelectorAll('.left-nav a');
            for (let i = 0; i < navLinks.length; i++) {
                navLinks[i].classList.toggle('active', isOverview ? i === 0 : ((isStars && i === 2) || (isProjects && i === 3) || (isPackages && i === 4) || (view === 'members' && i === 5)));
            }

            if (isStars) _loadStars();
            if (isPeople) _loadPeople(view);
            if (isProjects) _loadProjects();
            if (isPackages) _loadPackages();
        }

        async function _loadStars() {
            const starredTitle = document.getElementById('starred-section-title');
            const starredSec = document.getElementById('starred-section');
            if (!starredTitle || !starredSec) return;
            starredTitle.innerHTML = '<a class="stars-back" href="' + profileViewUrl('overview') + '" onclick="switchView(\'overview\'); return false;">&#x2039; back to profile</a>';
            const starred = _starredCache || (_starredCache = await fetchStarred());
            const navStars = document.getElementById('nav-star-count');
            if (navStars && starred.length > 0) navStars.textContent = formatNumber(starred.length);
            if (!starred.length) {
                starredSec.innerHTML = '<div class="repo-empty">no starred repositories found</div>';
                return;
            }
            starredTitle.insertAdjacentHTML('beforeend', ` <span class="stars-count">· ${starred.length}</span>`);
            const starredHtml = starred.map(repoCardHtml).join('');
            starredSec.innerHTML = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(starredHtml) : starredHtml;
        }

        // ---- Projects (GitHub classic) / Packages (vista SPA) ----
        let _projectsCache = null;
        let _packagesCache = null;

        async function fetchProjects() {
            const headers = authHeaders();
            headers['Accept'] = 'application/vnd.github+json';
            try {
                let res = await ghFetch(`https://api.github.com/users/${encodeURIComponent(USERNAME)}/projects?per_page=100`, { headers });
                // Los projects de una organización usan la ruta /orgs/...
                if (res.status === 404) {
                    res = await ghFetch(`https://api.github.com/orgs/${encodeURIComponent(USERNAME)}/projects?per_page=100`, { headers });
                }
                if (!res.ok) return [];
                const data = await res.json();
                return Array.isArray(data) ? data : [];
            } catch (_) { return []; }
        }

        function projectCardHtml(p) {
            const safeName = escHtml(p.name || '');
            const safeUrl = escAttr(sanitizeUrl(p.html_url || ''));
            const safeBody = p.body ? escHtml(p.body.slice(0, 140)) : '';
            const state = p.state === 'closed' ? 'closed' : 'open';
            return `
                <div class="repo-card">
                    <div class="repo-card-head">
                        ${safeUrl ? `<a class="repo-name" href="${safeUrl}" target="_blank" rel="noopener noreferrer">${safeName}</a>` : `<span class="repo-name">${safeName}</span>`}
                        <span class="repo-visibility">${state}</span>
                    </div>
                    ${safeBody ? `<p class="repo-desc">${safeBody}</p>` : ''}
                </div>
            `;
        }

        async function _loadProjects() {
            const titleEl = document.getElementById('projects-section-title');
            const listEl = document.getElementById('projects-section');
            if (!titleEl || !listEl) return;
            titleEl.innerHTML = '<a class="stars-back" href="' + profileViewUrl('overview') + '" onclick="switchView(\'overview\'); return false;">&#x2039; back to profile</a>';
            const projects = _projectsCache || (_projectsCache = await fetchProjects());
            const navCount = document.getElementById('nav-projects-count');
            if (navCount && projects.length > 0) navCount.textContent = formatNumber(projects.length);
            if (!projects.length) {
                listEl.innerHTML = '<div class="repo-empty">no projects found</div>';
                return;
            }
            titleEl.insertAdjacentHTML('beforeend', ` <span class="stars-count">· ${projects.length}</span>`);
            const projectsHtml = projects.map(projectCardHtml).join('');
            listEl.innerHTML = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(projectsHtml) : projectsHtml;
        }

        async function fetchPackages() {
            if (PROVIDER === 'cb') {
                // Codeberg (Gitea) expone /packages/{owner} con paginación; sin token
                // funciona para paquetes públicos.
                const packages = [];
                const token = localStorage.getItem('cb_token');
                const headers = token ? { 'Authorization': 'token ' + token } : {};
                try {
                    for (let page = 1; page <= 10; page++) {
                        const res = await fetch(`https://codeberg.org/api/v1/packages/${encodeURIComponent(USERNAME)}?limit=50&page=${page}`, { headers });
                        if (!res.ok) break;
                        const items = await res.json();
                        if (!Array.isArray(items) || items.length === 0) break;
                        packages.push(...items);
                        const link = res.headers.get('Link') || '';
                        if (!/<[^>]+>;\s*rel="next"/.test(link)) break;
                    }
                } catch (_) {}
                return packages;
            }
            const data = await apiGet(`/api/github/packages/${encodeURIComponent(USERNAME)}`);
            return Array.isArray(data) ? data : [];
        }

        function packageCardHtml(p) {
            const safeName = escHtml(p.name || '');
            const safeUrl = escAttr(sanitizeUrl(p.html_url || ''));
            // Codeberg no devuelve visibility: solo los paquetes públicos son listables.
            const visibility = p.visibility === 'private' ? 'private' : 'public';
            const type = escHtml(p.package_type || p.type || '');
            const version = p.version ? escHtml(p.version) : '';
            const meta = [type, version].filter(Boolean).join(' · ');
            return `
                <div class="repo-card">
                    <div class="repo-card-head">
                        ${safeUrl ? `<a class="repo-name" href="${safeUrl}" target="_blank" rel="noopener noreferrer">${safeName}</a>` : `<span class="repo-name">${safeName}</span>`}
                        <span class="repo-visibility">${visibility}</span>
                    </div>
                    ${meta ? `<p class="repo-desc">${meta}</p>` : ''}
                </div>
            `;
        }

        async function _loadPackages() {
            const titleEl = document.getElementById('packages-section-title');
            const listEl = document.getElementById('packages-section');
            if (!titleEl || !listEl) return;
            titleEl.innerHTML = '<a class="stars-back" href="' + profileViewUrl('overview') + '" onclick="switchView(\'overview\'); return false;">&#x2039; back to profile</a>';
            const packages = _packagesCache || (_packagesCache = await fetchPackages());
            const navCount = document.getElementById('nav-packages-count');
            if (navCount && packages.length > 0) navCount.textContent = formatNumber(packages.length);
            if (!packages.length) {
                listEl.innerHTML = '<div class="repo-empty">no packages found</div>';
                return;
            }
            titleEl.insertAdjacentHTML('beforeend', ` <span class="stars-count">· ${packages.length}</span>`);
            const packagesHtml = packages.map(packageCardHtml).join('');
            listEl.innerHTML = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(packagesHtml) : packagesHtml;
        }

        // ---- Seguidores / siguiendo (vista SPA reutilizada para ambas listas) ----
        let _profileData = null;
        let _peopleCache = {};
        function personCardHtml(p) {
            const safeUser = escHtml(p.username || '');
            const safeName = p.name ? escHtml(p.name) : '';
            const avatar = p.avatar_url ? escHtml(p.avatar_url) : '';
            const href = `/${PROVIDER}/${encodeURIComponent(p.username || '')}`;
            const safeHref = escHtml(href);
            const initial = escHtml((p.name || p.username || '?').slice(0, 1).toUpperCase());
            return `
                <div class="repo-card person-card">
                    <a class="person-avatar" href="${safeHref}" tabindex="-1">${avatar ? `<img src="${avatar}" alt=""/>` : initial}</a>
                    <div class="person-info">
                        <a class="repo-name" href="${safeHref}">${safeUser}</a>
                        ${safeName ? `<div class="person-name">${safeName}</div>` : ''}
                    </div>
                </div>
            `;
        }

        async function fetchPeople(kind) {
            const users = [];
            const path = kind === 'followers' ? 'followers' : 'following';
            try {
                if (PROVIDER === 'gh') {
                    const headers = authHeaders();
                    for (let page = 1; page <= 10; page++) {
                        const res = await ghFetch(`https://api.github.com/users/${encodeURIComponent(USERNAME)}/${path}?per_page=100&page=${page}`, { headers });
                        if (!res.ok) break;
                        const items = await res.json();
                        if (!Array.isArray(items) || items.length === 0) break;
                        for (const u of items) {
                            if (!u || !u.login) continue;
                            users.push({ username: u.login, name: u.name || '', avatar_url: u.avatar_url || '' });
                        }
                    }
                } else if (PROVIDER === 'gl') {
                    // GitLab solo expone followers/following por id de usuario.
                    const token = localStorage.getItem('gl_token');
                    const headers = token ? { 'PRIVATE-TOKEN': token } : {};
                    const uRes = await fetch(`https://gitlab.com/api/v4/users?username=${encodeURIComponent(USERNAME)}`, { headers });
                    const uArr = uRes.ok ? await uRes.json() : [];
                    const id = Array.isArray(uArr) && uArr[0] ? uArr[0].id : null;
                    if (!id) return users;
                    for (let page = 1; page <= 10; page++) {
                        const res = await fetch(`https://gitlab.com/api/v4/users/${id}/${path}?per_page=100&page=${page}`, { headers });
                        if (!res.ok) break;
                        const items = await res.json();
                        if (!Array.isArray(items) || items.length === 0) break;
                        for (const u of items) {
                            if (!u || !u.username) continue;
                            users.push({ username: u.username, name: u.name || '', avatar_url: u.avatar_url || '' });
                        }
                    }
                } else if (PROVIDER === 'cb') {
                    // Codeberg exige auth para followers/following (401 sin token).
                    const token = localStorage.getItem('cb_token');
                    if (!token) return users;
                    const headers = { 'Authorization': 'token ' + token };
                    for (let page = 1; page <= 10; page++) {
                        const res = await fetch(`https://codeberg.org/api/v1/users/${encodeURIComponent(USERNAME)}/${path}?limit=50&page=${page}`, { headers });
                        if (!res.ok) break;
                        const items = await res.json();
                        if (!Array.isArray(items) || items.length === 0) break;
                        for (const u of items) {
                            if (!u || !u.login) continue;
                            users.push({ username: u.login, name: u.full_name || u.name || '', avatar_url: u.avatar_url || '' });
                        }
                    }
                }
            } catch (_) {}
            return users;
        }

        async function _loadPeople(kind) {
            const titleEl = document.getElementById('people-section-title');
            const listEl = document.getElementById('people-section');
            if (!titleEl || !listEl) return;
            const label = kind === 'followers' ? 'followers' : kind === 'following' ? 'following' : 'members';
            titleEl.innerHTML = '<a class="stars-back" href="' + profileViewUrl('overview') + '" onclick="switchView(\'overview\'); return false;">&#x2039; back to profile</a> <span class="stars-count">' + label + '</span>';
            // Los miembros de una organización de Codeberg ya vienen en el perfil (public_members).
            let people;
            if (kind === 'members') {
                people = (_profileData && Array.isArray(_profileData.members))
                    ? _profileData.members.map(m => ({ username: m.login || m.username || '', name: m.name || m.full_name || '', avatar_url: m.avatar_url || '' }))
                    : [];
            } else {
                people = _peopleCache[kind] || (_peopleCache[kind] = await fetchPeople(kind));
            }
            titleEl.querySelector('.stars-count').textContent = `${label} · ${people.length}`;
            if (!people.length) {
                listEl.innerHTML = `<div class="repo-empty">no ${label} found</div>`;
                return;
            }
            const peopleHtml = people.map(personCardHtml).join('');
            listEl.innerHTML = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(peopleHtml) : peopleHtml;
        }

        async function fetchOrgs() {
            // Organizaciones del perfil: GitHub REST y Codeberg (Gitea) exponen /users/{user}/orgs.
            try {
                if (PROVIDER === 'cb') {
                    // Codeberg exige auth para /users/{user}/orgs (401 sin token): el
                    // backend reintenta sin token y responde lista vacía si no puede.
                    const items = await apiGet(`/api/users/orgs?provider=cb&user=${encodeURIComponent(USERNAME)}`);
                    if (!Array.isArray(items)) return [];
                    return items.filter(o => o && o.login).map(o => ({
                        name: o.login,
                        avatar: o.avatar_url || '',
                        url: `/cb/${encodeURIComponent(o.login)}`,
                    }));
                }
                if (PROVIDER === 'gh') {
                    const res = await ghFetch(`https://api.github.com/users/${encodeURIComponent(USERNAME)}/orgs?per_page=100`, { headers: authHeaders() });
                    if (!res.ok) return [];
                    const items = await res.json();
                    if (!Array.isArray(items)) return [];
                    return items.filter(o => o && o.login).map(o => ({
                        name: o.login,
                        avatar: o.avatar_url || '',
                        url: `/gh/${encodeURIComponent(o.login)}`,
                    }));
                }
            } catch (_) {}
            return [];
        }

        function renderOrgs(container, orgs) {
            if (!container) return;
            if (!Array.isArray(orgs) || orgs.length === 0) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = `
                <div class="orgs-row">
                    <span class="orgs-label">organizations</span>
                    ${orgs.map(o => `
                        <a class="org-avatar" href="${escAttr(o.url)}" title="${escAttr(o.name)}">
                            ${o.avatar ? `<img src="${escAttr(o.avatar)}" alt="${escAttr(o.name)}" loading="lazy"/>` : escHtml((o.name[0] || '?').toUpperCase())}
                        </a>`).join('')}
                </div>
            `;
        }

        async function loadOrgs() {
            const container = document.getElementById('orgs-row');
            if (!container || !USERNAME) return;
            renderOrgs(container, await fetchOrgs());
        }

        function renderReadme(text, baseUrl) {
            const section = document.getElementById('readme-section');
            if (!section) return;
            const readmeUrl = baseUrl || ((PROVIDER === 'gh')
                ? `https://raw.githubusercontent.com/${USERNAME}/${USERNAME}/HEAD/`
                : (PROVIDER === 'gl')
                    ? `https://gitlab.com/${USERNAME}/${USERNAME}/-/raw/HEAD/`
                    : `https://codeberg.org/${USERNAME}/.profile/raw/branch/main/`);
            const html = renderMd(text, readmeUrl);
            section.innerHTML = `
                <div class="readme-box">
                    <div class="readme-header">README.md</div>
                    <div class="readme-content readme">${html}</div>
                </div>
            `;
        }

        // ---- README del perfil (repo {user}/{user} en gh/gl; repo ".profile" en Codeberg) ----
        // Se carga a través del backend (/api/users/readme) en vez de fetch directo:
        // gitlab.com responde 302 hacia /users/sign_in cuando el repo no existe o es
        // privado, y el navegador bloquea esa redirección cross-origin por CORS.
        async function loadProfileReadme() {
            const data = await apiGet(`/api/users/readme?provider=${PROVIDER}&user=${encodeURIComponent(USERNAME)}`);
            if (!data || !data.content) return { text: '', baseUrl: '' };
            return { text: data.content, baseUrl: data.base_url || '' };
        }

        // ---- Heatmap de commits (sidebar) ----
        function dayKey(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        async function ghContributionDays(username) {
            // Vía proxy del servidor: con token usa la GraphQL API (conteos exactos por día);
            // sin token parsea el calendar del perfil público (niveles 0-4, sin conteo exacto).
            const data = await apiGet(`/api/users/contributions?user=${encodeURIComponent(username)}`);
            if (!data || !Array.isArray(data.days)) return null;
            const days = new Map();
            for (const d of data.days) {
                if (!d || !d.date) continue;
                const n = typeof d.count === 'number' ? d.count : (d.level || 0);
                if (!n) continue;
                days.set(d.date, (days.get(d.date) || 0) + n);
            }
            return { days, repos: new Map(), private: data.private || 0, total: data.total };
        }

        async function glContributionDays(username) {
            const days = new Map();
            const repos = new Map();
            const headers = localStorage.getItem('gl_token') ? { 'PRIVATE-TOKEN': localStorage.getItem('gl_token') } : {};
            const uRes = await fetch(`https://gitlab.com/api/v4/users?username=${encodeURIComponent(username)}`, { headers });
            if (!uRes.ok) return null;
            const users = await uRes.json();
            if (!Array.isArray(users) || !users[0] || !users[0].id) return null;
            const id = users[0].id;
            for (let page = 1; page <= 6; page++) {
                const res = await fetch(`https://gitlab.com/api/v4/users/${id}/events?action=pushed&per_page=100&page=${page}`, { headers });
                if (!res.ok) break;
                const events = await res.json();
                if (!Array.isArray(events) || events.length === 0) break;
                for (const ev of events) {
                    if (!ev || !ev.created_at) continue;
                    const key = dayKey(new Date(ev.created_at));
                    const n = (ev.push_data && ev.push_data.commit_count) || 1;
                    days.set(key, (days.get(key) || 0) + n);
                    if (ev.project_id) repos.set(String(ev.project_id), (repos.get(String(ev.project_id)) || 0) + n);
                }
                if (events.length < 100) break;
            }
            // GitLab no incluye el nombre del proyecto en los eventos: se resuelven los 2 con más commits.
            const topIds = Array.from(repos.entries()).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([id]) => id);
            const names = new Map();
            await Promise.all(topIds.map(async (pid) => {
                try {
                    const res = await fetch(`https://gitlab.com/api/v4/projects/${pid}`, { headers });
                    if (res.ok) {
                        const pj = await res.json();
                        if (pj && pj.path_with_namespace) names.set(pid, pj.path_with_namespace.split('/')[1] || pj.path_with_namespace);
                    }
                } catch (_) {}
            }));
            const reposNamed = new Map();
            for (const [pid, count] of repos) reposNamed.set(names.get(pid) || `#${pid}`, count);
            return { days, repos: reposNamed, private: 0 };
        }

        async function cbContributionDays(username) {
            // Codeberg (Gitea) expone el heatmap en GET /api/v1/users/{user}/heatmap, con el
            // mismo formato que data-heatmap-data de la página de actividad:
            // [{ timestamp (segundos), contributions }, ...]
            const days = new Map();
            const repos = new Map();
            const token = localStorage.getItem('cb_token');
            const headers = token ? { 'Authorization': 'token ' + token } : {};
            const res = await fetch(`https://codeberg.org/api/v1/users/${encodeURIComponent(username)}/heatmap`, { headers });
            if (!res.ok) return null;
            const items = await res.json();
            if (!Array.isArray(items)) return null;
            for (const item of items) {
                if (!item || !item.timestamp || !item.contributions) continue;
                const key = dayKey(new Date(item.timestamp * 1000));
                days.set(key, (days.get(key) || 0) + item.contributions);
            }
            return { days, repos, private: 0 };
        }

        function renderContributions(container, data, p) {
            // El backend de GitHub devuelve el total real del año; sin token los días son niveles
            // 0-4, así que la suma de días no reflejaría las contribuciones exactas.
            const total = typeof data.total === 'number' ? data.total : Array.from(data.days.values()).reduce((a, b) => a + b, 0);
            // El heatmap de Codeberg cuenta contribuciones (commits, issues, PRs, comentarios), no solo commits.
            const isCb = PROVIDER === 'cb';
            const unit = isCb ? 'contribution' : 'commit';
            const head = `
                <div class="hm-head">
                    <span class="hm-title">${isCb ? 'contributions' : 'commits'}</span>
                    <span class="hm-total">${total ? total.toLocaleString('en-US') + ' total' : ''}</span>
                </div>
            `;

            if (!total) {
                const noRepos = p && p.public_repos === 0;
                container.innerHTML = `
                    <div class="sb-contrib">
                        ${head}
                        <div class="hm-empty">${noRepos ? 'no repos' : 'no ' + unit + 's yet'}</div>
                    </div>
                `;
                return;
            }

            const top = Array.from(data.repos.entries()).sort((a, b) => b[1] - a[1]).slice(0, 2);
            let summary = top.length
                ? 'to ' + top.map(([name, n]) => `${escHtml(name)} (${n.toLocaleString('en-US')})`).join(', ')
                : '';
            if (data.private > 0) summary += (summary ? ', ' : 'to ') + `private (${data.private.toLocaleString('en-US')})`;

            const max = Math.max(...data.days.values());
            const now = new Date();
            const months = [];
            const start = new Date(now.getFullYear(), now.getMonth() - 11, 1);
            for (let d = new Date(start); d <= now; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
                months.push({ y: d.getFullYear(), m: d.getMonth() });
            }

            const monthHtml = months.map(({ y, m }) => {
                const first = new Date(y, m, 1);
                const daysInMonth = new Date(y, m + 1, 0).getDate();
                const lead = first.getDay();
                const label = first.toLocaleDateString('en-US', { month: 'short' }) + " '" + String(y).slice(2);
                let cells = '';
                for (let i = 0; i < lead; i++) cells += '<div class="hm-cell hm-blank"></div>';
                for (let day = 1; day <= daysInMonth; day++) {
                    const date = new Date(y, m, day);
                    if (date > now) { cells += '<div class="hm-cell hm-blank"></div>'; continue; }
                    const key = dayKey(date);
                    const n = data.days.get(key) || 0;
                    const lvl = n === 0 ? '' : ' lvl' + Math.max(1, Math.min(4, Math.ceil((n / max) * 4)));
                    cells += `<div class="hm-cell${lvl}" title="${key}: ${n} ${n === 1 ? unit : unit + 's'}"></div>`;
                }
                const rem = (7 - ((lead + daysInMonth) % 7)) % 7;
                for (let i = 0; i < rem; i++) cells += '<div class="hm-cell hm-blank"></div>';
                return `<div class="hm-month"><div class="hm-month-label">${label}</div><div class="hm-days">${cells}</div></div>`;
            }).join('');

            container.innerHTML = `
                <div class="sb-contrib">
                    ${head}
                    ${summary ? `<div class="hm-summary">${summary}</div>` : ''}
                    <div class="hm-months">${monthHtml}</div>
                    <div class="hm-legend">
                        less
                        <span class="hm-cell"></span>
                        <span class="hm-cell lvl1"></span>
                        <span class="hm-cell lvl2"></span>
                        <span class="hm-cell lvl3"></span>
                        <span class="hm-cell lvl4"></span>
                        more
                    </div>
                </div>
            `;
        }

        async function loadContributions(p) {
            const container = document.getElementById('sb-contributions');
            if (!container || !p || p.type === 'org') return;
            let data = null;
            try {
                if (PROVIDER === 'gh') data = await ghContributionDays(USERNAME);
                else if (PROVIDER === 'gl') data = await glContributionDays(USERNAME);
                else if (PROVIDER === 'cb') data = await cbContributionDays(USERNAME);
            } catch (_) { data = null; }
            if (!data) {
                // GitHub puede bloquear el scraping anónimo (anti-bot): avisar en vez de dejar la sidebar muda.
                if (PROVIDER === 'gh') {
                    container.innerHTML = '<div class="sb-contrib"><div class="hm-empty">heatmap unavailable: add a GitHub token or retry later</div></div>';
                }
                return;
            }
            renderContributions(container, data, p);
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        function scrollToRepos() {
            const el = document.getElementById('repos-section-title');
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function showError() {
            const header = document.getElementById('profile-header');
            if (header) header.innerHTML = '';
            const sbAbout = document.getElementById('sb-about');
            if (sbAbout) sbAbout.innerHTML = '';
            const main = document.getElementById('main-content');
            if (main) main.innerHTML = `<div class="profile-error">profile "${escHtml(USERNAME)}" not found on ${escHtml(providerMeta().label)}</div>`;
        }

        async function checkServiceStatus() {
            try {
                const response = await fetch(`${API_BASE}/api/status`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.panic_mode) {
                        const banner = document.getElementById('suspension-banner');
                        if (banner) banner.classList.add('active');
                    }
                }
            } catch (error) {
                console.error('Failed to check service status:', error);
            }
        }

        async function init() {
            const sbProvider = document.getElementById('sb-provider');
            if (sbProvider) sbProvider.textContent = PROVIDER;
            const sbUser = document.getElementById('sb-username');
            if (sbUser) sbUser.textContent = USERNAME || '—';

            // Projects solo existe en GitHub (clásicos); Packages también en Codeberg
            // (el backend ya devuelve el total en el perfil, y la vista se alimenta de
            // /packages/{owner} de la API).
            if (PROVIDER === 'gh') {
                const navProjects = document.getElementById('nav-projects');
                if (navProjects) navProjects.style.display = '';
            }
            if (PROVIDER === 'gh' || PROVIDER === 'cb') {
                const navPackages = document.getElementById('nav-packages');
                if (navPackages) navPackages.style.display = '';
            }

            if (!USERNAME) {
                showError();
                return;
            }

            const p = await apiGet(`/api/users/profile?provider=${PROVIDER}&user=${encodeURIComponent(USERNAME)}`);
            if (!p) {
                showError();
                return;
            }
            renderProfile(p);

            loadOrgs();

            loadContributions(p);

            const typeParam = p.type === 'org' ? '&type=org' : '';
            const repos = await apiGet(`/api/users/repos?provider=${PROVIDER}&user=${encodeURIComponent(USERNAME)}${typeParam}`);
            if (repos && Array.isArray(repos.repos)) {
                renderRepos(repos.repos);
            }

            loadStarred();

            const readme = await loadProfileReadme();
            if (readme.text) renderReadme(readme.text, readme.baseUrl);

            checkServiceStatus();

            if (_initialView !== 'overview') {
                switchView(_initialView, false);
            }

            window.addEventListener('popstate', function() {
                const vp = window.location.pathname.split('/').filter(Boolean);
                const sv = (vp.length >= 3) ? PROFILE_VIEWS[vp[2]] || 'overview' : 'overview';
                if (sv !== _currentView) switchView(sv, false);
            });

            document.querySelectorAll('.left-nav a[onclick]').forEach(a => {
                const onclick = a.getAttribute('onclick');
                const m = onclick.match(/navOverview|navRepos|openStars|openProjects|openPackages|openPeople/);
                if (m) {
                    const map = { navOverview: 'overview', navRepos: 'overview', openStars: 'stars', openProjects: 'projects', openPackages: 'packages' };
                    if (map[m[0]]) a.href = profileViewUrl(map[m[0]]);
                    else if (m[0] === 'openPeople') {
                        const km = onclick.match(/openPeople\('(\w+)'\)/);
                        if (km) a.href = profileViewUrl(km[1]);
                    }
                }
            });
        }

        // ---- Markdown (simplificado de repo.html) ----
        function renderMd(md, baseUrl) {
            if (typeof marked === 'undefined') return `<pre>${escHtml(md)}</pre>`;
            marked.setOptions({ gfm: true, breaks: false, headerIds: true, headerPrefix: '' });
            const renderer = new marked.Renderer();
            // marked@4 corta los bloques HTML en la primera línea en blanco; GitHub
            // (CommonMark 0.30) los cierra en su etiqueta </tag>. Sin esta extensión, los
            // README tipo "<h1 align=center>…<p>…iconos…</p></h1>" con contenido indentado
            // se convierten en bloque de código. Se extiende el bloque hasta el cierre.
            const BLOCK_HTML_TAGS = new Set(['address','article','aside','base','basefont','blockquote','body','caption','center','col','colgroup','dd','details','dialog','dir','div','dl','dt','fieldset','figcaption','figure','footer','form','frame','frameset','h1','h2','h3','h4','h5','h6','head','header','hgroup','hr','html','iframe','legend','li','link','main','menu','menuitem','meta','nav','noframes','ol','optgroup','option','p','param','section','source','summary','table','tbody','td','tfoot','th','thead','title','tr','track','ul']);
            const tokenizer = new marked.Tokenizer();
            const _origHtml = tokenizer.html;
            tokenizer.html = function(src) {
                const orig = _origHtml.call(this, src);
                if (!orig) return null;
                const m = /^ {0,3}<([a-z][a-z0-9-]*)\b/.exec(orig.raw);
                if (!m || !BLOCK_HTML_TAGS.has(m[1])) return orig;
                const tag = m[1];
                const firstLineEnd = orig.raw.indexOf('\n');
                const rest = firstLineEnd === -1 ? src.slice(orig.raw.length) : src.slice(firstLineEnd + 1);
                const cm = new RegExp('^[ \\t]*</' + tag + '[^>]*>', 'im').exec(rest);
                if (cm) {
                    const raw = src.slice(0, firstLineEnd + 1 + cm.index + cm[0].length);
                    return { type: 'html', raw: raw, pre: false, text: raw };
                }
                return orig;
            };
            renderer.link = function(token) {
                const href  = (token && token.href  != null) ? token.href  : (arguments[0] || '');
                const title = (token && token.title != null) ? token.title : (arguments[1] || null);
                const text  = (token && token.text  != null) ? token.text  : (arguments[2] || '');
                const t = title ? ` title="${escAttr(title)}"` : '';
                if (typeof href === 'string' && href.startsWith('#')) {
                    const anchor = href.slice(1);
                    return anchor ? `<a href="#" data-anchor="${escAttr(anchor)}"${t}>${text}</a>` : `<a href="#"${t}>${text}</a>`;
                }
                const safeScheme = /^(?:https?|mailto|ftp|sftp|tel|sms|file):/i;
                if (typeof href === 'string' && /^[a-z][a-z0-9+.-]*:/i.test(href) && !safeScheme.test(href)) {
                    return `<a href="#"${t}>${text}</a>`;
                }
                return `<a href="${escAttr(href)}" target="_blank" rel="noopener"${t}>${text}</a>`;
            };
            renderer.code = function(token) {
                const code = (token && token.text != null) ? token.text : (arguments[0] || '');
                const lang = (token && token.lang != null) ? token.lang : (arguments[1] || '');
                if (typeof hljs !== 'undefined' && lang && hljs.getLanguage(lang)) {
                    const hl = hljs.highlight(code, { language: lang }).value;
                    return `<pre style="white-space:pre;overflow-x:auto;"><code class="hljs language-${lang}">${hl}</code></pre>`;
                } else if (typeof hljs !== 'undefined') {
                    const hl = hljs.highlightAuto(code).value;
                    return `<pre style="white-space:pre;overflow-x:auto;"><code class="hljs">${hl}</code></pre>`;
                }
                return `<pre style="white-space:pre;overflow-x:auto;"><code>${escHtml(code)}</code></pre>`;
            };
            renderer.image = function(token) {
                let src   = (token && token.href  != null) ? token.href  : (arguments[0] || '');
                const alt   = (token && token.text  != null) ? token.text  : (arguments[1] || '');
                const title = (token && token.title != null) ? token.title : (arguments[2] || null);
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark' ||
                    (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (/#gh-light-mode-only$/i.test(src) && isDark)  return '';
                if (/#gh-dark-mode-only$/i.test(src)  && !isDark) return '';
                src = src.replace(/#gh-(light|dark)-mode-only$/i, '');
                if (src && !/^https?:\/\//i.test(src) && !/^data:/i.test(src)) {
                    src = baseUrl.replace(/\/$/, '') + '/' + src.replace(/^\.?\//, '');
                }
                return `<img src="${escAttr(src)}" alt="${escAttr(alt)}"${title ? ` title="${escAttr(title)}"` : ''} style="max-width:100%;border-radius:4px;" />`;
            };
            const _alertMeta = {
                note:      { label: 'Note',      icon: '<svg class="octicon octicon-info" viewBox="0 0 16 16" version="1.1" width="16" height="16" aria-hidden="true"><path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm8-6.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM6.5 7.75A.75.75 0 0 1 7.25 7h1a.75.75 0 0 1 .75.75v2.75h.25a.75.75 0 0 1 0 1.5h-2a.75.75 0 0 1 0-1.5h.25v-2h-.25a.75.75 0 0 1-.75-.75ZM8 6a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"></path></svg>' },
                tip:       { label: 'Tip',       icon: '<svg class="octicon octicon-light-bulb" viewBox="0 0 16 16" version="1.1" width="16" height="16" aria-hidden="true"><path d="M8 1.5c-2.363 0-4 1.69-4 3.75 0 .984.424 1.625.984 2.304l.214.253c.223.264.47.556.673.848.284.411.537.896.621 1.49a.75.75 0 0 1-1.484.211c-.04-.282-.163-.547-.37-.847a8.456 8.456 0 0 0-.542-.68c-.084-.1-.173-.205-.268-.32C3.201 7.75 2.5 6.766 2.5 5.25 2.5 2.31 4.863 0 8 0s5.5 2.31 5.5 5.25c0 1.516-.701 2.5-1.328 3.259-.095.115-.184.22-.268.319-.207.245-.383.453-.541.681-.208.3-.33.565-.37.847a.751.751 0 0 1-1.485-.212c.084-.593.337-1.078.621-1.489.203-.292.45-.584.673-.848.075-.088.147-.173.213-.253.561-.679.985-1.32.985-2.304 0-2.06-1.637-3.75-4-3.75ZM5.75 12h4.5a.75.75 0 0 1 0 1.5h-4.5a.75.75 0 0 1 0-1.5ZM6 15.25a.75.75 0 0 1 .75-.75h2.5a.75.75 0 0 1 0 1.5h-2.5a.75.75 0 0 1-.75-.75Z"></path></svg>' },
                important: { label: 'Important', icon: '<svg class="octicon octicon-report" viewBox="0 0 16 16" version="1.1" width="16" height="16" aria-hidden="true"><path d="M0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v9.5A1.75 1.75 0 0 1 14.25 13H8.06l-2.573 2.573A1.458 1.458 0 0 1 3 14.543V13H1.75A1.75 1.75 0 0 1 0 11.25Zm1.75-.25a.25.25 0 0 0-.25.25v9.5c0 .138.112.25.25.25h2a.75.75 0 0 1 .75.75v2.19l2.72-2.72a.749.749 0 0 1 .53-.22h6.5a.25.25 0 0 0 .25-.25v-9.5a.25.25 0 0 0-.25-.25Zm7 2.25v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 9a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"></path></svg>' },
                warning:   { label: 'Warning',   icon: '<svg class="octicon octicon-alert" viewBox="0 0 16 16" version="1.1" width="16" height="16" aria-hidden="true"><path d="M6.457 1.047c.659-1.234 2.427-1.234 3.086 0l6.082 11.378A1.75 1.75 0 0 1 14.082 15H1.918a1.75 1.75 0 0 1-1.543-2.575Zm1.763.707a.25.25 0 0 0-.44 0L1.698 13.132a.25.25 0 0 0 .22.368h12.164a.25.25 0 0 0 .22-.368Zm.53 3.996v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 11a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"></path></svg>' },
                caution:   { label: 'Caution',   icon: '<svg class="octicon octicon-stop" viewBox="0 0 16 16" version="1.1" width="16" height="16" aria-hidden="true"><path d="M4.47.22A.749.749 0 0 1 5 0h6c.199 0 .389.079.53.22l4.25 4.25c.141.14.22.331.22.53v6a.749.749 0 0 1-.22.53l-4.25 4.25A.749.749 0 0 1 11 16H5a.749.749 0 0 1-.53-.22L.22 11.53A.749.749 0 0 1 0 11V5c0-.199.079-.389.22-.53Zm.84 1.28L1.5 5.31v5.38l3.81 3.81h5.38l3.81-3.81V5.31L10.69 1.5ZM8 4a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 4Zm0 8a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"></path></svg>' }
            };
            const _defaultBlockquote = renderer.blockquote;
            renderer.blockquote = function(html) {
                const body = (typeof html === 'string') ? html : '';
                const firstP = body.match(/^<p>([\s\S]*?)<\/p>\s*/i);
                if (!firstP) return _defaultBlockquote.call(this, body);
                const lines = firstP[1].split('\n');
                const marker = (lines[0] || '').trim().match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\](?:\s+(.*))?$/i);
                if (!marker) return _defaultBlockquote.call(this, body);
                const type = marker[1].toLowerCase();
                const meta = _alertMeta[type] || _alertMeta.note;
                const title = (marker[2] || '').trim() || meta.label;
                const paraRest = lines.slice(1).join('\n').trim();
                const inner = (paraRest ? `<p>${paraRest}</p>\n` : '') + body.slice(firstP[0].length);
                return `<div class="markdown-alert markdown-alert-${type}">` +
                    `<p class="markdown-alert-title">${meta.icon} ${title}</p>\n` +
                    inner +
                    `</div>\n`;
