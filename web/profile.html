<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gitGost - profile</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js" integrity="sha384-GdEWAbCjn+ghjX0gLx7/N1hyTVmPAjdC2OvoAA0RyNcAOhqwtT8qnbCxWle2+uJX" crossorigin="anonymous"></script>
    <script>if (typeof hljs !== 'undefined') hljs.configure({ ignoreUnescapedHTML: true });</script>
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js" integrity="sha384-QsSpx6a0USazT7nK7w8qXDgpSAPhFsb2XtpoLFQ5+X2yFN6hvCKnwEzN8M5FWaJb" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/environment-badge@^1.0.0/dist/bundle.js"></script>
    <script>
        environmentBadge([
            { displayName: 'local', host: /(^localhost$|\.test$)/, backgroundColor: '#1a1a2e', foregroundColor: '#00d4ff' },
            { displayName: 'qa', host: /(^qa\.|.*-qa\.)/, backgroundColor: '#4a1942', foregroundColor: '#ff6ec7' },
            { displayName: 'preview', host: /(^preview\.|.*-preview\.)/, backgroundColor: '#1b2838', foregroundColor: '#66c0f4' },
        ]);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.13/dist/purify.min.js" integrity="sha384-ZuC+DIACqSIZTsp+7YF57cR5Y+6qXa7YFbEKdA/EHA/R0T+41dtorqucYl71Zp+t" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #1a1f2e;
            --fg-muted: #6b7280;
            --fg-secondary: #9ca3af;
            --bg-secondary: #f5f5f5;
            --bg-hover: #ebebeb;
            --accent: #d16014;
            --hm-1: #9be9a8;
            --hm-2: #40c463;
            --hm-3: #30a14e;
            --hm-4: #216e39;
            --border: #e0e0e0;
            --card: #f9f9f9;
            --code-bg: #f4f4f4;
            --radius-lg: 4px;
            --radius-md: 4px;
            --radius-sm: 3px;
            --radius-pill: 999px;
            --alert-note: #0969da;
            --alert-tip: #1a7f37;
            --alert-important: #8250df;
            --alert-warning: #9a6700;
            --alert-caution: #cf222e;
        }
        :root[data-theme="dark"] {
            --bg: #000000;
            --fg: #d4d4d4;
            --fg-muted: #9ca3af;
            --fg-secondary: #6b7280;
            --bg-secondary: #0d0d0d;
            --bg-hover: #1a1a1a;
            --accent: #ffa657;
            --hm-1: #0e4429;
            --hm-2: #006d32;
            --hm-3: #26a641;
            --hm-4: #39d353;
            --border: #222222;
            --card: #0d0d0d;
            --code-bg: #111111;
            --alert-note: #4493f8;
            --alert-tip: #3fb950;
            --alert-important: #ab7df8;
            --alert-warning: #d29922;
            --alert-caution: #ff7b72;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme]) {
                --bg: #000000; --fg: #d4d4d4; --fg-muted: #9ca3af;
                --fg-secondary: #6b7280; --bg-secondary: #0d0d0d;
                --bg-hover: #1a1a1a; --accent: #ffa657;
                --hm-1: #0e4429; --hm-2: #006d32; --hm-3: #26a641; --hm-4: #39d353;
                --border: #222222; --card: #0d0d0d; --code-bg: #111111;
                --alert-note: #4493f8; --alert-tip: #3fb950; --alert-important: #ab7df8;
                --alert-warning: #d29922; --alert-caution: #ff7b72;
            }
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: "IBM Plex Sans", system-ui, sans-serif;
            font-size: 0.9rem;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        .statusbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 0.5rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
        }
        .statusbar-left { display: flex; align-items: center; gap: 0.5rem; }
        .statusbar-right { display: flex; align-items: center; gap: 0.5rem; }
        .statusbar a { color: var(--accent); text-decoration: none; }
        .statusbar a:hover { text-decoration: underline; }
        .statusbar .crumb { color: var(--fg-muted); }
        .statusbar .crumb.provider { color: var(--accent); }
        .statusbar .current { color: var(--fg); }

        .profile-layout {
            display: flex;
            flex: 1;
            min-height: 0;
            width: 100%;
        }

        .left-nav {
            width: 200px;
            border-right: 1px solid var(--border);
            overflow-y: auto;
            overflow-x: hidden;
            flex-shrink: 0;
            background: var(--bg);
            padding: 0.4rem 0;
        }
        .left-nav a {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.45rem 1rem;
            color: var(--fg-muted);
            text-decoration: none;
            font-size: 0.8rem;
            font-family: 'IBM Plex Mono', monospace;
            white-space: nowrap;
            border-left: 2px solid transparent;
            transition: background 0.1s, color 0.1s;
        }
        .left-nav a:hover { background: var(--bg-hover); color: var(--fg); }
        .left-nav a.active { border-left-color: var(--accent); color: var(--fg); background: var(--bg-hover); font-weight: 600; }
        .left-nav a .count { margin-left: auto; color: var(--fg-secondary); font-size: 0.68rem; }

        .main-content {
            flex: 1;
            min-width: 0;
            padding: 1.5rem 2rem;
            max-width: 860px;
        }

        .right-sidebar {
            width: 300px;
            border-left: 1px solid var(--border);
            padding: 1.25rem 1.25rem;
            overflow-y: auto;
            flex-shrink: 0;
            background: var(--bg);
        }

        .section-title {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--fg-muted);
            margin: 1.6rem 0 0.6rem;
        }
        .section-title:first-child { margin-top: 0; }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.25rem;
        }
        .profile-header .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--fg-muted);
            flex-shrink: 0;
            overflow: hidden;
        }
        .profile-header .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-header .id .fullname { font-weight: 700; font-size: 1.1rem; }
        .profile-header .id .username { color: var(--fg-muted); font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; }
        .profile-header .id .badges { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.35rem; }

        .provider-badge {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.65rem;
            border: 1px solid;
            border-radius: var(--radius-pill);
            padding: 0.15em 0.6em;
            opacity: 0.85;
            background: var(--bg-secondary);
            display: inline-flex;
            align-items: center;
            gap: 0.3em;
        }
        .provider-badge svg { display: block; }

        .type-badge {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.65rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            padding: 0.15em 0.6em;
            color: var(--fg-muted);
            background: var(--bg-secondary);
            display: inline-flex;
            align-items: center;
        }

        .readme-box {
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            margin-bottom: 1.5rem;
        }
        .readme-header {
            padding: 0.5rem 1rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.68rem;
            color: var(--fg-muted);
        }
        .readme-content { padding: 1.25rem 1.5rem; }

        .readme h1, .readme h2, .readme h3, .readme h4, .readme h5, .readme h6 {
            margin: 1.2em 0 0.5em;
            line-height: 1.3;
            font-weight: 700;
            color: var(--fg);
        }
        .readme h1 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
        .readme h2 { font-size: 1.25em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
        .readme h3 { font-size: 1.1em; }
        .readme h4 { font-size: 1em; }
        .readme p { margin: 0.75em 0; line-height: 1.6; }
        .readme code {
            background: var(--code-bg);
            border-radius: 3px;
            padding: 0.15em 0.35em;
            font-family: "IBM Plex Mono", monospace;
            font-size: 0.82em;
        }
        .readme pre {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.75rem 1rem;
            overflow-x: auto;
            margin: 1em 0;
            font-family: "IBM Plex Mono", monospace;
            font-size: 0.78rem;
            line-height: 1.5;
        }
        .readme pre code { background: transparent; padding: 0; font-size: 1em; }
        .readme a { color: var(--accent); }
        .readme a:hover { text-decoration: underline; }
        .readme blockquote {
            margin: 1em 0;
            padding: 0.1em 1em;
            border-left: 0.25em solid var(--border);
            color: var(--fg-muted);
        }
        .readme ul, .readme ol { margin: 0.75em 0; padding-left: 1.5em; }
        .readme li { margin: 0.25em 0; }
        .readme img { max-width: 100%; vertical-align: middle; border-radius: 4px; }
        .readme table { border-collapse: collapse; margin: 1em 0; display: block; overflow-x: auto; }
        .readme th, .readme td { border: 1px solid var(--border); padding: 0.4em 0.8em; }
        .readme th { background: var(--bg-secondary); }
        .readme tr:nth-child(even) { background: var(--bg-secondary); }
        .readme hr { border: none; border-top: 1px solid var(--border); margin: 1.5em 0; }

        .markdown-alert {
            padding: 0.5rem 1rem;
            margin: 1rem 0;
            border: 1px solid var(--border);
            border-left-width: 0.25em;
            border-radius: 4px;
        }
        .markdown-alert > :first-child { margin-top: 0; }
        .markdown-alert > :last-child { margin-bottom: 0; }
        .markdown-alert-title {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 600;
            margin: 0 0 0.25rem;
        }
        .markdown-alert-title .octicon { margin-right: 0.5rem; flex-shrink: 0; fill: currentColor; }
        .markdown-alert-note      { border-left-color: var(--alert-note); }
        .markdown-alert-important { border-left-color: var(--alert-important); }
        .markdown-alert-warning   { border-left-color: var(--alert-warning); }
        .markdown-alert-tip       { border-left-color: var(--alert-tip); }
        .markdown-alert-caution   { border-left-color: var(--alert-caution); }

        .repo-list { display: flex; flex-direction: column; gap: 0; }
        .repo-card {
            border-bottom: 1px solid var(--border);
            padding: 0.8rem 0;
            transition: background-color 0.1s ease;
        }
        .repo-card:last-child { border-bottom: none; }
        .repo-card:hover { background: var(--bg-hover); }
        .repo-card-head { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
        .repo-name {
            color: var(--accent);
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            font-family: 'IBM Plex Mono', monospace;
        }
        .repo-name:hover { text-decoration: underline; }
        .repo-visibility {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.62rem;
            color: var(--fg-muted);
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            padding: 0.1em 0.55em;
            background: var(--bg-secondary);
            flex-shrink: 0;
        }
        .repo-desc {
            color: var(--fg-muted);
            margin: 0.4rem 0;
            font-size: 0.75rem;
            line-height: 1.5;
        }
        .repo-meta {
            display: flex;
            gap: 0.9rem;
            color: var(--fg-secondary);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.68rem;
            flex-wrap: wrap;
        }
        .repo-meta .lang { display: inline-flex; align-items: center; gap: 0.3rem; }
        .lang-dot { width: 0.6em; height: 0.6em; border-radius: 50%; display: inline-block; }
        .repo-empty {
            color: var(--fg-secondary);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            padding: 1rem 0;
        }
        .stars-back {
            color: var(--accent);
            text-decoration: none;
        }
        .stars-back:hover { text-decoration: underline; }
        .stars-count { color: var(--fg-secondary); font-weight: 400; }
        /* Oculta secciones de main al alternar vistas (SPA); gana a display inline y a .repo-list */
        .view-hidden { display: none !important; }

        .person-card { display: flex; align-items: center; gap: 0.8rem; }
        .person-avatar {
            width: 2.3rem;
            height: 2.3rem;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--fg-muted);
            overflow: hidden;
            flex-shrink: 0;
            text-decoration: none;
        }
        .person-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .person-info { min-width: 0; }
        .person-name { color: var(--fg-muted); font-size: 0.72rem; margin-top: 0.1rem; }

        .orgs-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }
        .orgs-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            color: var(--fg-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .org-avatar {
            width: 2.1rem;
            height: 2.1rem;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--fg-muted);
            overflow: hidden;
            flex-shrink: 0;
            text-decoration: none;
        }
        .org-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .profile-error {
            color: var(--fg-secondary);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.8rem;
            padding: 2rem;
        }

        .sb-about .sb-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--fg-muted);
            overflow: hidden;
            flex-shrink: 0;
        }
        .sb-about .sb-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .sb-about .sb-head { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.8rem; }
        .sb-about .sb-name { font-weight: 700; font-size: 0.95rem; }
        .sb-about .sb-user { color: var(--fg-muted); font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; }
        .sb-about .sb-bio { color: var(--fg-muted); font-size: 0.78rem; line-height: 1.5; margin: 0 0 0.8rem; }

        .stats-grid {
            display: flex;
            gap: 0.9rem;
            margin: 0.8rem 0;
        }
        .stat { display: flex; flex-direction: column; }
        .stat .v { font-family: 'IBM Plex Mono', monospace; font-size: 0.9rem; font-weight: 600; }
        .stat .l { color: var(--fg-secondary); font-size: 0.65rem; }
        .stat-link { cursor: pointer; }
        .stat-link:hover .v { color: var(--accent); text-decoration: underline; }

        .sb-btn {
            display: block;
            width: 100%;
            text-align: center;
            padding: 0.4rem 0.5rem;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: transparent;
            color: var(--fg);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.72rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 0.5rem;
        }
        .sb-btn:hover { background: var(--bg-hover); border-color: var(--fg-secondary); }

        .meta-list {
            list-style: none;
            margin: 0.9rem 0 0;
            padding: 0.9rem 0 0;
            border-top: 1px solid var(--border);
            color: var(--fg-muted);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .meta-list li { display: flex; justify-content: space-between; gap: 0.6rem; }
        .meta-list .k { color: var(--fg-secondary); }
        .meta-list .v { color: var(--fg-muted); text-align: right; }
        .meta-list a { color: var(--accent); text-decoration: none; }
        .meta-list a:hover { text-decoration: underline; }

        .sb-contrib {
            margin-top: 0.9rem;
            padding-top: 0.9rem;
            border-top: 1px solid var(--border);
            font-family: 'IBM Plex Mono', monospace;
        }
        .sb-contrib .hm-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 0.5rem;
            margin-bottom: 0.7rem;
        }
        .sb-contrib .hm-title {
            font-size: 0.7rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--fg-muted);
        }
        .sb-contrib .hm-total {
            font-size: 0.68rem;
            color: var(--fg-secondary);
        }
        .sb-contrib .hm-summary {
            margin-bottom: 0.7rem;
            font-size: 0.68rem;
            color: var(--fg-muted);
            line-height: 1.5;
        }
        .sb-contrib .hm-empty {
            padding: 0.3rem 0 0.2rem;
            font-size: 0.72rem;
            color: var(--fg-secondary);
        }
        .hm-months {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
            gap: 0.7rem;
        }
        .hm-month { display: flex; flex-direction: column; gap: 0.25rem; }
        .hm-month-label {
            font-size: 0.58rem;
            color: var(--fg-secondary);
            text-transform: uppercase;
        }
        .hm-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }
        .hm-cell {
            aspect-ratio: 1;
            border-radius: 2px;
            background: var(--bg-hover);
        }
        .hm-cell.hm-blank { background: transparent; }
        .hm-cell.lvl1 { background: var(--hm-1); }
        .hm-cell.lvl2 { background: var(--hm-2); }
        .hm-cell.lvl3 { background: var(--hm-3); }
        .hm-cell.lvl4 { background: var(--hm-4); }
        .hm-legend {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.3rem;
            margin-top: 0.7rem;
            font-size: 0.58rem;
            color: var(--fg-secondary);
        }
        .hm-legend .hm-cell { width: 0.7rem; height: 0.7rem; }

        .suspension-banner {
            display: none;
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 4px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            font-family: "IBM Plex Mono", monospace;
            font-size: 0.78rem;
            color: #856404;
            align-items: center;
            gap: 0.75rem;
        }
        :root[data-theme="dark"] .suspension-banner {
            background: #663d03;
            border-color: #ffa657;
            color: #ffe6a7;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme]) .suspension-banner {
                background: #663d03;
                border-color: #ffa657;
                color: #ffe6a7;
            }
        }
        .suspension-banner.active { display: flex; }

        @media (max-width: 900px) {
            .left-nav { display: none; }
            .right-sidebar { display: none; }
            .main-content { padding: 1rem; }
        }
        @media (max-width: 560px) {
            .profile-header { flex-direction: column; align-items: flex-start; }
            .stats-grid { flex-wrap: wrap; }
            .statusbar { padding: 0.5rem 0.9rem; }
            .readme-content { padding: 1rem; }
            .hm-months { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); }
        }
    </style>
</head>
<body>
    <div id="suspension-banner" class="suspension-banner">
        <div class="suspension-banner-icon">⚠️</div>
        <div class="suspension-banner-content">
            <strong>Service Temporarily Suspended</strong>
            The service is temporarily suspended due to detected bot activity. Push operations are currently disabled.
        </div>
    </div>

    <div class="statusbar">
        <div class="statusbar-left">
            <a href="/" style="color:var(--accent);text-decoration:none;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:0.78rem;">gitGost</a>
            <span style="color:var(--fg-muted);">›</span>
            <span class="crumb provider" id="sb-provider">—</span>
            <span style="color:var(--fg-muted);">›</span>

        }
        const API_BASE = getApiBase();

        // Ruta limpia: /gh|gl|cb/{username}
        const _pathParts = window.location.pathname.split('/').filter(Boolean);
        let PROVIDER = (_pathParts[0] === 'gl' || _pathParts[0] === 'cb') ? _pathParts[0] : 'gh';
        let USERNAME = '';
        try {
            USERNAME = decodeURIComponent(_pathParts[1] || '');
        } catch (_) {
            USERNAME = _pathParts[1] || '';
        }
        // Fallback con query params: /profile.html?provider=gh&user=octocat.
        // repo.html enlaza así para que el perfil también abra en la app (Capacitor
        // sirve contenido local y no tiene el fallback de rutas limpias del servidor).
        const _qp = new URLSearchParams(window.location.search);
        const _qpProvider = _qp.get('provider');
        const _qpUser = _qp.get('user');
        if (_qpProvider) PROVIDER = (_qpProvider === 'gl' || _qpProvider === 'cb') ? _qpProvider : 'gh';
        if (_qpUser) USERNAME = _qpUser;

        const PROFILE_VIEWS = { stars: 'stars', followers: 'followers', following: 'following', members: 'members', projects: 'projects', packages: 'packages' };
        const _viewPart = (_pathParts.length >= 3) ? _pathParts[2] : '';

        function profileViewUrl(view) {
            const base = `/${encodeURIComponent(PROVIDER)}/${encodeURIComponent(USERNAME)}`;
            const suffix = PROFILE_VIEWS[view] || '';
            return suffix ? `${base}/${suffix}` : base;
        }

        function escHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function escAttr(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function sanitizeUrl(url) {
            if (!url) return '';
            try {
                const parsed = new URL(url, window.location.href);
                if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
                    return url;
                }
            } catch (_) {}
            return '';
        }

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + "M";
            if (num >= 1000) return (num / 1000).toFixed(1) + "k";
            return String(num);
        }

        function timeAgo(dateStr) {
            if (!dateStr) return '';
            const diff = Date.now() - new Date(dateStr).getTime();
            if (isNaN(diff) || diff < 0) return '';
            const mins = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);
            const weeks = Math.floor(days / 7);
            const months = Math.floor(days / 30);
            if (mins < 60) return mins <= 1 ? 'just now' : `${mins}m ago`;
            if (hours < 24) return `${hours}h ago`;
            if (days < 7) return `${days}d ago`;
            if (weeks < 5) return `${weeks}w ago`;
            if (months < 12) return `${months}mo ago`;
            return `${Math.floor(months / 12)}y ago`;
        }

        function providerMeta() {
            if (PROVIDER === 'gl') {
                return { label: 'gitlab', name: 'gitlab.com', color: '#FC6D26', icon: gitlabBadgeIcon() };
            }
            if (PROVIDER === 'cb') {
                return { label: 'codeberg', name: 'codeberg.org', color: '#2185D0', icon: codebergBadgeIcon() };
            }
            return { label: 'github', name: 'github.com', color: '#181717', icon: githubBadgeIcon() };
        }

        function authHeaders() {
            const key = PROVIDER === 'gl' ? 'gl_token' : PROVIDER === 'cb' ? 'cb_token' : 'gh_token';
            const token = localStorage.getItem(key);
            return token ? { 'Authorization': 'token ' + token } : {};
        }

        function ghFetch(url, opts = {}) {
            const target = new URL(url, window.location.href);
            if (target.hostname === 'api.github.com') {
                const proxyBase = new URL(`${API_BASE}/api/gh-proxy`);
                return fetch(new URL(`${proxyBase.pathname}${target.pathname}${target.search}`, proxyBase.origin), opts);
            }
            return fetch(target.toString(), opts);
        }

        async function apiGet(path) {
            try {
                const res = await fetch(`${API_BASE}${path}`, { headers: authHeaders() });
                if (!res.ok) return null;
                return await res.json();
            } catch (_) {
                return null;
            }
        }

        function renderProfile(p) {
            _profileData = p;
            const meta = providerMeta();
            const safeUser = escHtml(p.username || USERNAME);
            const safeName = escHtml(p.name || '');

            const safeBio = escHtml(p.bio || '');

            const safeWebsite = escAttr(sanitizeUrl(p.website || ''));

            const linkedinLabel = escHtml((p.linkedin || '').replace(/^https?:\/\/(www\.)?linkedin\.com\//i, ''));
            const safeYoutube = escAttr(sanitizeUrl(p.youtube || ''));
